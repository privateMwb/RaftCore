<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RaftCore" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07140F"/>
      <stop offset="100%" stop-color="#040A07"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#82AB46" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0F2A20" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#040A07" stop-opacity="0"/>
      <stop offset="100%" stop-color="#040A07" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <rect width="1200" height="280" fill="url(#fade)"/>

  <!-- Three-node cluster marks: the filled node is the Leader. -->
  <g transform="translate(350,114)" fill="none" stroke="#10B981" stroke-width="1.6" opacity="0.65" stroke-linecap="round">
    <path d="M14 7 L4 28 M14 7 L24 28 M4 28 L24 28"/>
    <circle cx="14" cy="6" r="4" fill="#10B981"/>
    <circle cx="4" cy="28" r="4"/>
    <circle cx="24" cy="28" r="4"/>
  </g>
  <g transform="translate(822,114)" fill="none" stroke="#F59E0B" stroke-width="1.6" opacity="0.65" stroke-linecap="round">
    <path d="M14 7 L4 28 M14 7 L24 28 M4 28 L24 28"/>
    <circle cx="14" cy="6" r="4" fill="#F59E0B"/>
    <circle cx="4" cy="28" r="4"/>
    <circle cx="24" cy="28" r="4"/>
  </g>

  <text x="600" y="155" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="72" font-weight="700" letter-spacing="4"
        fill="url(#titleGradient)" filter="url(#glow)">RaftCore</text>

  <rect x="400" y="185" width="400" height="2" fill="url(#lineGradient)"/>

  <text x="600" y="220" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="18" letter-spacing="2" fill="#8FB3A3">RAFT CONSENSUS FOR C++23</text>
</svg>
